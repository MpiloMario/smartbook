<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SmartBook</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1120">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        display: ['Space Grotesk', 'Inter', 'sans-serif']
                    },
                    colors: { midnight: '#0b1120' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1120;
            color: #e2e8f0;
            -webkit-font-smoothing: antialiased;
        }
        .mesh-bg {
            background:
                radial-gradient(600px circle at 80% 15%, rgba(217, 70, 239, .16), transparent 55%),
                radial-gradient(700px circle at 15% 85%, rgba(139, 92, 246, .18), transparent 55%);
        }
        .glass-card {
            background: rgba(15, 23, 42, .7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, .08);
            box-shadow: 0 30px 90px -30px rgba(139, 92, 246, .35);
        }
        .gradient-text {
            background: linear-gradient(90deg, #a78bfa 0%, #22d3ee 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .btn-neon {
            background: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);
            box-shadow: 0 8px 30px -6px rgba(139, 92, 246, .55);
            transition: all .25s ease;
        }
        .btn-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 44px -6px rgba(139, 92, 246, .75);
        }
        .input-dark {
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .1);
            color: #e2e8f0;
            transition: all .2s ease;
        }
        .input-dark::placeholder { color: #64748b; }
        .input-dark:focus {
            outline: none;
            border-color: rgba(34, 211, 238, .6);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, .15);
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen mesh-bg py-10">

<div class="glass-card p-8 rounded-3xl w-full max-w-sm mx-4">
    <div class="flex flex-col items-center mb-8">
        <span class="w-14 h-14 rounded-2xl btn-neon flex items-center justify-center mb-4">
            <i data-lucide="calendar-check" class="w-7 h-7 text-white"></i>
        </span>
        <h2 class="font-display text-2xl font-bold text-white">Create <span class="gradient-text">account</span></h2>
        <p class="text-sm text-slate-400 mt-1">Join SmartBook in seconds</p>
    </div>

    <input id="username" type="text" placeholder="Username"
        class="input-dark w-full mb-4 px-4 py-3 rounded-xl">

    <input id="roomNumber" type="text" placeholder="Room number"
        class="input-dark w-full mb-4 px-4 py-3 rounded-xl">

    <input id="email" type="email" placeholder="Email"
        class="input-dark w-full mb-4 px-4 py-3 rounded-xl">

    <input id="password" type="password" placeholder="Password"
        class="input-dark w-full mb-4 px-4 py-3 rounded-xl">

    <input id="confirmPassword" type="password" placeholder="Confirm Password"
        class="input-dark w-full mb-6 px-4 py-3 rounded-xl">

    <button id="registerBtn"
        class="btn-neon w-full text-white py-3 rounded-xl font-bold">
        Register
    </button>

    <p class="text-sm text-center mt-6 text-slate-400">
        Already have an account?
        <a href="login.html" class="text-violet-300 hover:text-cyan-300 transition font-medium">Login</a>
    </p>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
<script type="module" src="scripts/register.js"></script>
</body>
</html>
